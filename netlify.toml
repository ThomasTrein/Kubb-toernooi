[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  # NEXT_PUBLIC_* vars zijn bewust publiek (Next.js bakt ze in de client bundle).
  # Netlify's secrets scanner mag ze daarom niet als lek behandelen.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_ADMIN_PIN"

[[plugins]]
  package = "@netlify/plugin-nextjs"
